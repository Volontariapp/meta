# mesh-mcp.toml: Volontariapp meta workspace
# Hand-tuned from `mesh-mcp init --auto` output, every key checked against causalmesh's own source
# (crates/mesh-core/src/config.rs is `deny_unknown_fields`: an invented key fails at startup).
#
# Audit history (details in git log of this file and in ~/Developer/causalmesh/rex-volontariapp-7.0.6.md):
#   - 2026-09-23, 2.9.1 / 3e626ee: `${workspace_root}` templating, docs.paths and proto_dirs
#     substitution fixed upstream (07daff9, 08578a8, 3.0.0); gRPC handler linking for
#     `@GrpcMethod(SERVICE_CONST, EnumType.X)` fixed (3e626ee).
#   - 2026-09-28, 7.0.6 / 737fedd: `ci-tools` submodule (14 copies, ~17% of the index) excluded.
#   - 2026-10-06, 7.0.19 / bcf220b: this revision. Six causal patterns added (jobs, sagas, SQL
#     trigger producers, WebSocket push, mobile client listeners), policy skills remapped so the
#     most specific playbook wins, docs aliases fixed (one of them was destroying matches),
#     `.agents/` indexed so search_docs also finds the team's skills.
#
# Fixed upstream since the 7.0.6 report (no workaround needed any more):
#   7.0.7 analyze_grpc no longer traces RPCs that merely contain the target, and resolves calls
#         made through `commandService`/`queryService` inherited from base-grpc.controller.ts;
#   7.0.8 wire-format check compares enum values; 7.0.9 secret masking of `const password = '...'`;
#   7.0.10 analyze_impact `depth >= 2` follows re-emissions (rows marked heuristic);
#   7.0.12 find_dependents counts barrels and describe-only specs.
#
# Still-known limits on THIS codebase (treat as leads, confirm with a targeted rg in one repo):
#   * events emitted through a lookup table are invisible: EVENT_CREATION_FAILED is pushed by
#     ws-service's gather via npm-packages/packages/messaging/src/websockets/events/mapping.ts;
#   * the job-audit SQL trigger builds its stream name at runtime
#     (`stream_prefix || ':job:outbox:success'`), so JOB_OUTBOX_* producers are not resolved;
#   * a named import from an external npm package can be linked to a homonymous workspace symbol
#     (`import { Index } from 'typeorm'`), visible in visualize_mesh only.
#
# 7.0.19 `mesh-mcp init --write-ide-config` writes a routing block into CLAUDE.md/AGENTS.md that
# points to `.agents/skills/mesh-mcp/SKILL.md`. The skill is `.agents/skills/volontariapp-mesh-mcp/`
# here: do not run that command, AGENTS.md section 2 already carries the routing table.

[workspace]
name = "volontariapp-meta"
version = "1.0.0"

# Lets the same file run unmodified from another checkout or in CI via
# `WORKSPACE_ROOT=/path/to/meta mesh-mcp run`; ".." because this file lives in .agents/.
workspace_root = "${WORKSPACE_ROOT:-..}"

# `roots` is also the security jail: anything outside is refused.
roots = [
  "${workspace_root}/proto-registry",
  "${workspace_root}/npm-packages",
  "${workspace_root}/api-gateway",
  "${workspace_root}/ms-event",
  "${workspace_root}/ms-post",
  "${workspace_root}/ms-social",
  "${workspace_root}/ms-storage",
  "${workspace_root}/ms-user",
  "${workspace_root}/ws-service",
  "${workspace_root}/outbox-runners",
  "${workspace_root}/post-processors-runner",
  "${workspace_root}/workers-runners",
  "${workspace_root}/nativapp",
  "${workspace_root}/deploy",
  "${workspace_root}/docs",
  # The team's OKF skills and this file: search_docs("outbox") then also returns the playbooks
  # (volontariapp-implement-async-*), not only the C1-C4 docs. Plugin skills are excluded below.
  "${workspace_root}/.agents"
]

exclude_patterns = [
  "**/.git/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/target/**",
  "**/coverage/**",
  "**/graphify-out/**",
  "**/npm-packages/tools/changelog-checker-*",
  # Root-name-prefixed patterns work since causalmesh 08578a8 (ExcludeMatcher::is_excluded_with_root).
  "**/deploy/submodules/**",  # mirrored copies of the same repos, nested inside the deploy root
  # Shared CI tooling, a git submodule checked out in 14 roots (`doctor` warns on it since 7.0.13).
  "**/ci-tools/**",
  # Third-party matt-pocock skills (generic workflow advice, not Volontariapp knowledge) and the
  # generated OKF index/log files, which only repeat the SKILL.md titles.
  "**/.agents/plugins/**",
  "**/.agents/skills/index.md",
  "**/.agents/skills/*/index.md",
  "**/.agents/skills/*/log.md",
  "**/.agents/skills/log.md",
  "**/*.log",
  "**/.env*",
  "**/secrets/**",
  "**/*.pem",
  "**/*.key",
  "**/*.jks",
  "**/*.p12",
  "**/*.pfx",
  "**/certs/**"
]

# ==============================================================================
# Engine 1: Documentation (search_docs). crates/mesh-core/src/docs.rs normalize_query():
# the query is split on whitespace, `stop_words` are dropped, then each remaining word is
# REPLACED by its alias. An alias therefore loses every match of the original word: it must
# point to a term the docs actually use, or to a stem shared by both spellings.
# Counts below: occurrences in docs/ on 2026-10-06 (rg -i -c).
# ==============================================================================
[engines.docs]
enabled = true
# "*.md" keeps per-service CLAUDE.md/README.md (exact event payloads in ms-post/CLAUDE.md) and the
# .agents skills, on top of the C1-C4 architecture docs.
paths = ["${workspace_root}/docs/**", "*.md"]
# Filler words that otherwise add +5 per section and drown the real keyword (French and English,
# agents ask in both). Domain words such as "job", "event", "flux" are kept on purpose.
stop_words = [
  "le", "la", "les", "un", "une", "des", "du", "de", "d'un", "d'une", "et", "ou", "est", "sont",
  "comment", "quoi", "quel", "quelle", "quels", "quelles", "pour", "dans", "sur", "avec", "par",
  "qui", "que", "ce", "cette", "ces", "on", "faire",
  "the", "a", "an", "of", "to", "in", "is", "are", "how", "what", "which", "does", "do", "and",
  "or", "for", "with", "by", "from", "it", "this", "that"
]
exact_phrase_boost = 60
fuzzy_fallback = true
sanitize_prompt_injections = true

# Aliases: see the REPLACED-word warning above.
[engines.docs.aliases]
# stems shared by the French and English spellings
"idempotence" = "idempot"
"idempotency" = "idempot"
"idempotent" = "idempot"
# shorthand -> spelling used in the docs
"k8s" = "kubernetes"  # kubernetes 11, k8s 0
"ws" = "websocket"  # websocket 12
"pg" = "postgres"
"postgresql" = "postgres"  # postgres 109 (also matches "postgresql")
"pp" = "post-processor"
"postprocessor" = "post-processor"
"postprocessors" = "post-processor"
"gw" = "gateway"  # "api gateway" 14 + "api-gateway" 43, both contain "gateway"
"bull" = "bullmq"
"mq" = "bullmq"
"neo" = "neo4j"
"rn" = "nativapp"
"mobile" = "nativapp"  # nativapp 17, mobile 4
"internal-token" = "internal_token"
"internaltoken" = "internal_token"
"security" = "sécurité"  # sécurité 9, security 2
"scatter" = "scatter-gather"
# "dlq" is deliberately NOT aliased: the docs write "dlq" (5) and never "dead-letter-queue" (0);
# the previous `"dlq" = "dead-letter-queue"` turned every DLQ question into 0 results.

# ==============================================================================
# Engine 2: Formal contracts (Protobuf). Every key below is read
# (ExtractConfig::from_contracts, crates/mesh-parsers/src/languages/mod.rs).
# ==============================================================================
[engines.contracts]
enabled = true

[engines.contracts.grpc]
proto_dirs = ["${workspace_root}/proto-registry/proto"]
# Only @GrpcMethod is used (no @GrpcService, @GrpcStreamMethod, @MessagePattern or @EventPattern in
# ms-*/api-gateway, rg 2026-10-06). Add a decorator here the day one appears.
controller_annotations = ["@GrpcMethod"]
canonical_fqcn_projection = true

# [engines.contracts.openapi] stays off: api-gateway/swagger-static/*.json is generated at build
# time and gitignored (api-gateway/.gitignore:63), and the crawler always respects .gitignore.
# Re-enable only if the generated specs get committed.
# [engines.contracts.openapi]
# enabled = true
# spec_files = ["api-gateway/swagger-static/openapi-*.json"]

# ==============================================================================
# Declarative causal patterns (crates/mesh-parsers/src/languages/mod.rs extract_custom_patterns):
#   topic_producer -> node `produce:<target>`, linked to every consumer of the same topic
#   topic_consumer -> node `<consumer_group>` (or `consume:<target>`), linked likewise
#   saga           -> node named `<target>`, listed under "related sagas" by analyze_impact when
#                     its name contains the queried topic
#   rpc            -> node `rpc:<target>`, recorded as a gRPC call
# Topic keys go through normalize_topic_key() (mesh-core/src/contracts.rs): a member reference
# such as `UserJobType.FALLBACK_X`, `JobMessagingType.FALLBACK_X` or `Streams.X` is reduced to its
# lowercase member (`fallback_x`), so different enums naming the same member share one topic.
# `file_pattern` is matched as a SUFFIX OR SUBSTRING of the path after its leading `*` and `.`
# are stripped (CompiledPattern::matches_path): "*.ts" becomes the bare needle "ts", which also
# matches `.agents/...`, any `events/` or `tests/` folder and their Markdown. Every pattern below
# uses "/src/" instead (all TypeScript sources live under a src/ directory; docs, skills and this
# file never do), or a file-name suffix such as "options.ts". Regexes are Rust `regex` syntax (no
# look-around), single-quoted so backslashes stay single. An invalid regex is logged on stderr
# and skipped: check with `mesh-mcp graph --format mermaid 2>&1 | grep -i pattern`.
# ==============================================================================

# ---- Domain events (Transactional Outbox -> Redis Streams -> post-processors) -----------------

# Producer side, business type: `EventQueueEntity.createEvent<T>(...)`
# (npm-packages/packages/database/src/outbox, called from the domain-* repositories).
[[engines.contracts.patterns]]
name = "outbox-event-producer"
kind = "topic_producer"
file_pattern = "/src/"
regex = 'createEvent<([A-Za-z0-9_.]+)>'
target_group = 1

# Producer side, physical stream: `targetServices: [Streams.EVENT_CREATED]`
# (domain-event/.../postgres-event.repository.ts). Same normalized key as the business type.
[[engines.contracts.patterns]]
name = "outbox-target-stream"
kind = "topic_producer"
file_pattern = "/src/"
regex = 'targetServices:\s*\[\s*(\w+\.\w+)'
target_group = 1

# Producer side, SQL: a Postgres trigger that writes into event_queue. Convention
# `create_<topic>_event_queue_record()` (npm-packages/packages/domain-user/src/database/triggers):
# the captured `user_created` is exactly the key of `UserEventMessagingType.USER_CREATED`, which
# had "No producer resolved" before this pattern (it also hits the twin users.trigger.sql). Anchored on CREATE so the
# `EXECUTE FUNCTION create_..._event_queue_record()` line of the same file is not a second hit.
[[engines.contracts.patterns]]
name = "sql-trigger-event-producer"
kind = "topic_producer"
file_pattern = "/src/"
regex = 'CREATE\s+OR\s+REPLACE\s+FUNCTION\s+create_(\w+)_event_queue_record\(\)'
target_group = 1

# Consumer side: `class XPostProcessor extends BatchPostProcessor<T>` (post-processors-runner/**,
# ws-service/src/post-processors/**).
[[engines.contracts.patterns]]
name = "batch-post-processor"
kind = "topic_consumer"
file_pattern = "/src/"
regex = 'class\s+(\w+)\s+extends\s+BatchPostProcessor<([^>]+)>'
target_group = 2
consumer_group = 1

# Consumer side, gather: the stream lives in a sibling options file
# (`streamName: getEventStreamName(Streams.EVENT_CREATED)`, ws-service/src/post-processors/*/options/).
# Linking works when enum member names match; `SocialEventMessagingType.EVENT_SOCIAL_CREATED`
# riding `Streams.WS_EVENT_CREATED_FEEDBACK` stays a separate topic.
[[engines.contracts.patterns]]
name = "gather-stream-consumer"
kind = "topic_consumer"
file_pattern = "options.ts"
regex = 'streamName:\s*get\w*StreamName\((\w+\.\w+)\)'
target_group = 1

# Saga compensation: a post-processor that moves an aggregate's `saga_status`
# (post-processor-event/.../event-creation-failed.post-processor.ts sets SagaStatus.CANCEL,
# event-creation-successfull sets DONE). Node named after the event it reacts to, so
# analyze_impact("EVENT_CREATION_FAILED") lists it under related sagas. The class header and the
# `saga_status:` assignment are ~1.8 KB apart in today's files: 4000 leaves room to grow.
[[engines.contracts.patterns]]
name = "saga-status-transition"
kind = "saga"
file_pattern = ".post-processor.ts"
regex = 'extends\s+BatchPostProcessor<([^>]+)>[\s\S]{0,4000}?saga_status:\s*SagaStatus\.\w+'
target_group = 1

# ---- Jobs (Transactional Outbox -> BullMQ -> workers) ----------------------------------------

# Producer side: a command controller turns a failed synchronous command into a background job,
# `this.withFallback(UserJobType.FALLBACK_UPDATE_USER, user.id, data, ...)`
# (ms-*/src/modules/*/controllers/command*/). Before this pattern no job had a producer.
[[engines.contracts.patterns]]
name = "fallback-job-producer"
kind = "topic_producer"
file_pattern = "/src/"
regex = 'withFallback\(\s*(\w+\.\w+)'
target_group = 1

# Consumer side, per job type: one handler class per job,
# `export class FallbackCreateEventHandler implements IJobHandler<...> { ... public readonly
# jobType = JobMessagingType.FALLBACK_CREATE_EVENT;` (workers-runners/*/src/workers/handlers/**).
# Links to the producer above through the shared member (`fallback_create_event`).
[[engines.contracts.patterns]]
name = "job-handler-consumer"
kind = "topic_consumer"
file_pattern = "/src/"
regex = 'class\s+(\w+)\s+implements\s+IJobHandler<[\s\S]{0,600}?jobType\s*=\s*(\w+\.\w+)'
target_group = 2
consumer_group = 1

# Consumer side, per worker: `class EventWorker extends BaseWorker<JobMessagingType>` keys on the
# whole enum (no member), so it surfaces the worker class, not a job link.
[[engines.contracts.patterns]]
name = "bullmq-job-worker"
kind = "topic_consumer"
file_pattern = "/src/"
regex = 'class\s+(\w+)\s+extends\s+BaseWorker<([^>]+)>'
target_group = 2
consumer_group = 1

# Consumer side, physical queue: `@Processor(EventsQueue.EVENTS)` above the worker class.
[[engines.contracts.patterns]]
name = "bullmq-processor-queue"
kind = "topic_consumer"
file_pattern = "/src/"
regex = '@Processor\((\w+\.\w+)\)[\s\S]{0,120}?class\s+(\w+)\s+extends\s+BaseWorker'
target_group = 1
consumer_group = 2

# ---- Real-time push (ws-service -> Socket.IO -> nativapp) ------------------------------------
# Both sides name `WebsocketMessagingType.X`. Its normalized key is the member (`post_liked`),
# the same as the domain event's: analyze_impact("POST_LIKED") therefore runs end to end, from
# the outbox producer to the nativapp handler that updates the UI. That merge is intended; the
# rows still say which file is a Socket.IO push and which a Redis consumer.

# Producer side: NotificationService calls in ws-service post-processors
# (`notifyUser(id, WebsocketMessagingType.POST_LIKED, ...)`, `broadcastExcept(...)`, `broadcast(...)`).
[[engines.contracts.patterns]]
name = "websocket-push-producer"
kind = "topic_producer"
file_pattern = "/src/"
regex = '(?:notifyUser|broadcastExcept|broadcast)\([^;]{0,160}?(\w*WebsocketMessagingType\.\w+)'
target_group = 1

# Consumer side: the mobile client's listeners,
# `socket.on(WebsocketMessagingType.POST_CREATED, handlePostCreated)`
# (nativapp/src/hooks/useNotificationHandlers.ts, 23 listeners on 2026-10-06).
[[engines.contracts.patterns]]
name = "nativapp-socket-listener"
kind = "topic_consumer"
file_pattern = "/src/"
regex = 'socket\.on\(\s*(\w*WebsocketMessagingType\.\w+)\s*,\s*(\w+)'
target_group = 1
consumer_group = 2

# ==============================================================================
# Engine 3: Policy (governance.rs). Mirrors AGENTS.md section 1 (STOP rule).
# ==============================================================================
[engines.policy]
enabled = true
enforce_git_hooks = true
cryptographic_audit_trail = true
# allow_all on purpose. `enforce_refusal` would refuse every READ of npm-packages/proto-registry,
# which an agent needs precisely to apply the STOP workflow; `audit_warn` only writes a stderr
# trace no agent sees. Writes are guarded by the Claude Code hook .claude/hooks/stop-rule-guard.sh.
read_governance_mode = "allow_all"

# Matched as whole path segments (evaluate_guard). Used by RSAH refusals when read_governance_mode
# is not allow_all, and shown in `mesh-mcp doctor`.
[engines.policy.stop_rules]
"proto-registry" = "STOP: proto-registry ne compile pas les contrats TS localement. Sa CI ouvre une PR dans npm-packages pour régénérer @volontariapp/contracts : attendre la publication avant de toucher aux microservices."
"npm-packages" = "STOP: après build, test et changeset, passer la main au Lead Dev pour la PR. Ne jamais contourner l'attente de publication avec un `as unknown as Type` ou du `any`."

# recommend_skill(): a key equal to the TOOL NAME wins over everything (no subject match is even
# tried), otherwise the LONGEST key contained (case-insensitive) in the call's scope/target/query
# wins. The previous `"analyze_impact"` tool key therefore sent every async question, jobs and
# WebSocket included, to trace-async-flow: replaced by subject keys. Paths are relative to this
# file's directory (resolve_skill_paths), so they resolve whatever the server's cwd is.
# The table itself is GENERATED by `evolve.py index` from the `mesh_keys` of each SKILL.md
# (volontariapp-skill-evolution): edit the skill's frontmatter, never the lines below.
