# mesh-mcp.toml — Volontariapp meta workspace
# Hand-tuned from `mesh-mcp init --auto` output + verified against real repo structure
# (rg checks for BaseWorker / IJobHandler / BatchPostProcessor / createEvent / @GrpcMethod).
#
# Re-audited 2026-09-23 against causalmesh @ 75b1748 (mesh-mcp 2.9.1, rebuilt from source —
# the previously installed ~/.local/bin binary was a stale 2.9.0 prebuilt and silently gave
# different behavior than this file's own source tree, see notes below):
#   - `${workspace_root}` templating: the old binary genuinely didn't substitute it (empirically
#     reproduced: 0/1 roots resolved). Fixed upstream in causalmesh commit 07daff9 ("fix: correct
#     root resolution..."), which landed BEFORE this file was first written but AFTER the binary
#     on this machine was built. Rebuilding (`cargo build --workspace --release`) and reinstalling
#     fixed it — re-verified empirically (1/1, then 2/2 roots resolved with `${WORKSPACE_ROOT:-...}`
#     unset and set). Now safe to use, so this file does.
#   - SETUP.md's config reference table (in this same causalmesh checkout) claims
#     `[engines.contracts.grpc]`, `.openapi`, `[engines.docs] enabled/paths`, and
#     `[engines.policy] enabled` are "accepted but not read by anything". That is stale docs, not
#     current behavior: crates/mesh-server/src/indexer.rs `extract_config()` / `engine_toggles()`
#     and crates/mesh-core/src/state.rs's own tests show these are wired. Verified by grepping the
#     source directly rather than trusting SETUP.md. Configured below accordingly.
#
# Re-audited again 2026-09-23 against causalmesh @ 3e626ee (mesh-mcp 2.9.1, rebuilt from source):
#   - Upstream fixed the gRPC handler-linking bug this session had previously reported (a
#     `@GrpcMethod(SERVICE_CONST, EnumType.SIGN_UP)` decorator using identifiers instead of string
#     literals produced a garbled node name that never matched the proto's bare RPC name, so
#     `analyze_grpc`'s "Server Handlers" was empty for every single gRPC handler in this codebase
#     — 100% of them use this decorator shape). Fix commit 3e626ee, independently verified via
#     `cargo test --workspace` (200/200) and `cargo clippy` (clean) before rebuilding/reinstalling.
#     Re-tested on this exact config: `analyze_grpc("SignUp")` now returns 1 server handler
#     (previously 0). No config change was needed for this one — it was a parser bug, not a
#     config bug; the fix landed purely in causalmesh's own source.
#   - The `proto_dirs`/`spec_files` `${workspace_root}` bug documented below is a SEPARATE,
#     still-unfixed issue (different function, `allows_proto_path()`/`spec_file_matches()`) —
#     the workaround (plain substrings, no `${workspace_root}` prefix) below is still required.

[workspace]
name = "volontariapp-meta"
version = "1.0.0"

# Verified working (see note above). Lets the same file run unmodified from a different checkout
# path or in CI via `WORKSPACE_ROOT=/path/to/meta mesh-mcp run`; defaults to ".." because this
# file lives one level below the repo root, in .agents/.
workspace_root = "${WORKSPACE_ROOT:-..}"

roots = [
  "${workspace_root}/proto-registry",
  "${workspace_root}/npm-packages",
  "${workspace_root}/api-gateway",
  "${workspace_root}/ms-event",
  "${workspace_root}/ms-post",
  "${workspace_root}/ms-social",
  "${workspace_root}/ms-storage",
  "${workspace_root}/ms-user",
  "${workspace_root}/ws-service",
  "${workspace_root}/outbox-runners",
  "${workspace_root}/post-processors-runner",
  "${workspace_root}/workers-runners",
  "${workspace_root}/nativapp",
  "${workspace_root}/deploy",
  "${workspace_root}/docs"
]

exclude_patterns = [
  "**/.git/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/target/**",
  "**/coverage/**",
  "**/graphify-out/**",
  # Root-name-prefixed exclude patterns (a pattern containing the crawl root's own directory
  # name as a literal segment, e.g. "deploy" here when "deploy" is itself a root) used to be
  # silently dead: crawl_scope() is called once per root and strips that root's prefix before
  # matching, so "**/deploy/submodules/**" never matched anything from inside the deploy root
  # itself. Fixed upstream in causalmesh commit 08578a8 (ExcludeMatcher::is_excluded_with_root,
  # which also checks root_name.join(rel)) — re-verified empirically after rebuilding: this
  # canonical form now correctly dedupes deploy/submodules/* from every other root's real copy.
  "**/deploy/submodules/**",  # mirrored copies of the same repos, nested inside the deploy root
  "**/*.log",
  "**/.env*",
  "**/secrets/**",
  "**/*.pem",
  "**/*.key",
  "**/*.jks",
  "**/*.p12",
  "**/*.pfx",
  "**/certs/**"
]

# ==============================================================================
# Engine 1: Documentation Engine (C1-C4 architecture docs)
# `enabled` and `paths` are wired (indexer.rs engine_toggles()/doc_path_allowed()). `paths` used
# to only match relative-to-root globs (a literal "${workspace_root}/docs" placeholder never
# matched anything — confirmed empirically: search_docs("outbox") returned 0/23 real hits).
# Fixed upstream in causalmesh commit 08578a8: ExcludeMatcher::compile() now strips a
# "${workspace_root}/" or "${WORKSPACE_ROOT}/" prefix from any `paths`/`exclude_patterns` entry
# before compiling the glob, so the canonical documented form below now genuinely narrows
# indexing to docs/ (re-verified after rebuilding mesh-mcp: 10/10 relevant sections, 0 noise).
# Kept "*.md" alongside it deliberately — it additionally surfaces per-service CLAUDE.md/README.md
# files (e.g. ms-post/CLAUDE.md's exact event payloads), which search_docs found genuinely useful
# in practice and which "${workspace_root}/docs/**" alone would exclude.
[engines.docs]
enabled = true
paths = ["${workspace_root}/docs/**", "*.md"]
aliases = { "ws" = "websocket", "k8s" = "kubernetes", "dlq" = "dead-letter-queue", "grpc" = "grpc" }
exact_phrase_boost = 60
fuzzy_fallback = true
sanitize_prompt_injections = true

# ==============================================================================
# Engine 2: Formal Schema Engine (Protobuf / OpenAPI)
# `[engines.contracts.grpc]`/`.openapi` fields below are wired (ExtractConfig::from_contracts
# in mesh-parsers/src/languages/mod.rs), despite SETUP.md's stale claim that they're inert.
# ==============================================================================
[engines.contracts]
enabled = true

[engines.contracts.grpc]
# `${workspace_root}` in proto_dirs used to be a literal substring that never matched any real
# absolute path (allows_proto_path() wasn't run through the same substitution as roots/
# exclude_patterns/docs.paths), silently disabling all proto extraction. Fixed upstream in
# causalmesh 3.0.0 (strip_workspace_root_prefix() now shared by ExcludeMatcher::compile(),
# allows_proto_path(), and spec_file_matches()) — re-verified empirically on this exact config
# after rebuilding: analyze_grpc("SignUp") finds the proto definition again with the canonical
# templated form below.
proto_dirs = ["${workspace_root}/proto-registry/proto"]
# Only @GrpcMethod is actually used across ms-event/ms-post/ms-social/ms-user (verified via rg,
# 2026-09-23). @GrpcService does not appear anywhere in the codebase today; add it back if a
# service-level decorator is introduced.
controller_annotations = ["@GrpcMethod"]
canonical_fqcn_projection = true

# [engines.contracts.openapi] is disabled — genuinely dead, not a causalmesh config bug this
# time. `api-gateway/swagger-static/*.json` is generated at build time by @nestjs/swagger and
# gitignored (api-gateway/.gitignore:63, `swagger-static/*`) — verified via
# `git check-ignore -v`. mesh-mcp's crawler always respects .gitignore with no override, so
# these files are never scanned regardless of how `spec_files` is written (confirmed via
# `mesh-mcp doctor`, which now detects and warns on exactly this since 3.0.0). To re-enable:
# either commit the generated specs (defeats the point of gitignoring build output), or run
# `yarn generate:openapi` (or equivalent) and un-ignore the output before indexing — neither is
# done today, so leave this section commented out rather than carrying dead config.
# [engines.contracts.openapi]
# enabled = true
# spec_files = [
#   "api-gateway/swagger-static/openapi-global.json",
#   "api-gateway/swagger-static/openapi-user.json",
#   "api-gateway/swagger-static/openapi-post.json",
#   "api-gateway/swagger-static/openapi-social.json",
#   "api-gateway/swagger-static/openapi-event.json"
# ]

# ==============================================================================
# Declarative Custom Pattern Engine — matched against real source (verified via rg):
#   workers-runners/**  -> `export class XWorker extends BaseWorker<T>`
#   post-processors-runner/** -> `export class XPostProcessor extends BatchPostProcessor<T>`
#   npm-packages/packages/database/src/outbox -> `EventQueueEntity.createEvent<T>(...)`
# ==============================================================================
[[engines.contracts.patterns]]
name = "outbox-event-producer"
kind = "topic_producer"
file_pattern = "*.ts"
regex = 'createEvent<([A-Za-z0-9_.]+)>'
target_group = 1

[[engines.contracts.patterns]]
name = "batch-post-processor"
kind = "topic_consumer"
file_pattern = "*.ts"
regex = 'class\s+(\w+)\s+extends\s+BatchPostProcessor<([^>]+)>'
target_group = 2
consumer_group = 1

[[engines.contracts.patterns]]
name = "bullmq-job-worker"
kind = "topic_consumer"
file_pattern = "*.ts"
regex = 'class\s+(\w+)\s+extends\s+BaseWorker<([^>]+)>'
target_group = 2
consumer_group = 1

# The two patterns above key nodes by the *business event type* (e.g.
# `EventEventMessagingType.EVENT_CREATED`), never by the actual physical
# channel it travels over. These two surface that channel identity as its
# own node — the real Redis Stream key (outbox producer side, verified in
# npm-packages/packages/domain-event/.../postgres-event.repository.ts:69,
# `targetServices: [Streams.EVENT_CREATED]`) and the real BullMQ queue name
# (worker consumer side, verified in workers-runners/*/src/workers/*.worker.ts,
# `@Processor(EventsQueue.EVENTS)`). They deliberately do NOT try to merge
# with the event-type nodes above — the pattern engine has no reliable way
# to prove a given event type always rides a specific stream/queue, so a
# separate, honestly-unconnected node is safer than a fabricated link.
[[engines.contracts.patterns]]
name = "outbox-target-stream"
kind = "topic_producer"
file_pattern = "*.ts"
regex = 'targetServices:\s*\[\s*(\w+\.\w+)'
target_group = 1

[[engines.contracts.patterns]]
name = "bullmq-processor-queue"
kind = "topic_consumer"
file_pattern = "*.ts"
# @Processor(...) decorates the class from above it, e.g.:
#   @Injectable()
#   @Processor(EventsQueue.EVENTS)
#   export class EventWorker extends BaseWorker<JobMessagingType> {
regex = '@Processor\((\w+\.\w+)\)[\s\S]{0,120}?class\s+(\w+)\s+extends\s+BaseWorker'
target_group = 1
consumer_group = 2

# ==============================================================================
# Engine 3: Policy Steering & Active Governance — mirrors .agents/AGENTS.md §1
# (Cas A: npm-packages, Cas B: proto-registry — both require STOP + human handoff)
# `enabled` is wired (mesh-core/src/state.rs tests: `enabled = false` disables both
# stop_rules and skills), despite SETUP.md listing it as inert — keep this true.
# ==============================================================================
[engines.policy]
enabled = true
enforce_git_hooks = true
cryptographic_audit_trail = true

[engines.policy.stop_rules]
"proto-registry" = "🛑 STOP: proto-registry ne compile pas les contrats TS localement. Sa CI ouvre une PR dans npm-packages pour régénérer @volontariapp/contracts — attendre la publication avant de toucher aux microservices."
"npm-packages" = "🛑 STOP: après build/test/changeset, passer la main au Lead Dev pour la PR. Ne jamais bricoler un `as unknown as Type` ou du `any` en attendant la publication NPM."

# Keys are matched exactly against the MCP tool name first (governance.rs recommend_skill()),
# then case-insensitively as a substring of the query's scope/target, longest match wins.
# "engines.contracts.grpc" (the old key here) is neither a real tool name nor a string that can
# ever appear in a query's scope/target, so it could never fire — dead config. Fixed below to the
# real tool name. Also filled in the three playbooks from AGENTS.md's skill matrix that weren't
# wired to anything yet (all five files verified present under .agents/skills/global/).
[engines.policy.skills]
"analyze_grpc" = ".agents/skills/global/proto-contract-evolution/SKILL.md"
"proto-registry" = ".agents/skills/global/proto-contract-evolution/SKILL.md"
"npm-packages" = ".agents/skills/global/shared-npm-package-change/SKILL.md"
"analyze_impact" = ".agents/skills/global/trace-async-flow/SKILL.md"
"workers-runners" = ".agents/skills/global/implement-async-job-flow/SKILL.md"
"outbox-runners" = ".agents/skills/global/implement-async-job-flow/SKILL.md"
"post-processors-runner" = ".agents/skills/global/implement-async-event-flow/SKILL.md"
